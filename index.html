<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKT's Gooffy Little Mod - Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #171717;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
    }

    #status {
      color: #ccc;
      margin: 15px 0;
    }

    #game-container {
      width: 100%;
      max-width: 1100px;
      margin: 20px auto;
    }

    #game {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      display: block;
    }

    #loading {
      margin: 20px auto;
      max-width: 500px;
    }

    #progress-bar {
      width: 100%;
      height: 18px;
      background: #444;
      border-radius: 10px;
      overflow: hidden;
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: #4caf50;
      transition: width 0.2s;
    }

    button {
      padding: 10px 18px;
      margin: 10px;
      border: none;
      border-radius: 6px;
      background: #3578db;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #2462bd;
    }

    #error {
      color: #ff7777;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 20px auto;
      max-width: 900px;
    }
  </style>
</head>

<body>
  <h1>KKT's Gooffy Little Mod</h1>
  <p>WebGL build loading test · Version 1.1.0</p>

  <div id="status">Preparing to load the game...</div>

  <div id="loading">
    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>
    <p id="progress-text">0%</p>
  </div>

  <div id="game-container">
    <canvas id="game" tabindex="-1"></canvas>
  </div>

  <button id="fullscreen-button" onclick="goFullscreen()">
    Fullscreen
  </button>

  <div id="error"></div>

  <script>
    // Cloudflare Worker proxy for the original itch.io Unity build.
    // The Worker accepts lowercase filenames and maps them to itch.io's exact casing.
    const buildUrl =
      "https://nsmb-itch-proxy.owen-vozzella.workers.dev/";

    // Individual Unity WebGL files
    const loaderUrl = buildUrl + "webgl.loader.js";
    const frameworkUrl = buildUrl + "webgl.framework.js.unityweb";
    const codeUrl = buildUrl + "webgl.wasm.unityweb";
    const dataUrl = buildUrl + "webgl.data.unityweb";

    const canvas = document.getElementById("game");
    const status = document.getElementById("status");
    const progressFill = document.getElementById("progress-fill");
    const progressText = document.getElementById("progress-text");
    const errorBox = document.getElementById("error");

    function showError(message) {
      status.textContent = "The game could not be loaded.";
      errorBox.textContent = message;
      console.error(message);
    }

    function goFullscreen() {
      if (canvas.requestFullscreen) {
        canvas.requestFullscreen();
      }
    }

    // Unity configuration
    const config = {
      dataUrl: dataUrl,
      frameworkUrl: frameworkUrl,
      codeUrl: codeUrl,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "KingKittyTurnip",
      productName: "KKT's Gooffy Little Mod",
      productVersion: "1.1.0",

      showBanner: function (message, type) {
        console.log("Unity banner:", type, message);
      }
    };

    // Load the Unity loader script
    status.textContent = "Loading Unity loader...";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = function () {
      status.textContent = "Unity loader loaded. Starting game...";

      createUnityInstance(canvas, config, function (progress) {
        const percentage = Math.round(progress * 100);

        progressFill.style.width = percentage + "%";
        progressText.textContent = percentage + "%";

        status.textContent = "Loading game: " + percentage + "%";
      }).then(function (instance) {
        status.textContent = "Game loaded successfully!";
        progressFill.style.width = "100%";
        progressText.textContent = "100%";
        window.unityInstance = instance;

        document.getElementById("loading").style.display = "none";
      }).catch(function (message) {
        showError(message);
      });
    };

    script.onerror = function () {
      showError(
        "Could not load the Unity loader script.\n\n" +
        "URL: " + loaderUrl + "\n\n" +
        "Check that the Cloudflare Worker is deployed and reachable."
      );
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
